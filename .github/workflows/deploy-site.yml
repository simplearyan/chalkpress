name: Deploy IITM site to GitHub Pages

# Builds the Astro site from the canonical content store and publishes it.
# Project-pages deploys live at https://<owner>.github.io/<repo>/ — the
# workflow exports BASE so every internal link and asset path is prefixed.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'runtime/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Validate content store
        run: node tools/validate.mjs

      - name: Install site deps
        working-directory: site
        run: npm ci

      - name: Build site (project-pages base)
        working-directory: site
        env:
          # e.g. owner=octocat repo=iitm-studio → /iitm-studio
          BASE: /${{ github.event.repository.name }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
